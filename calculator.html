<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f9;
        }
        .calculator {
            border-radius: 10px;
            box-shadow: 0px 0px 10px 2px #888888;
            width: 320px;
            background-color: #ffffff;
        }
        .calculator-screen {
            width: 100%;
            height: 80px;
            border: none;
            text-align: right;
            padding-right: 20px;
            padding-left: 20px;
            font-size: 3rem;
            background-color: #252525;
            color: #ffffff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .calculator-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            padding: 20px;
        }
        button {
            height: 60px;
            border: none;
            background-color: #eaeaea;
            font-size: 2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button.operator {
            background-color: #f57c00;
            color: #ffffff;
        }
        button.equals {
            grid-column: span 2;
            background-color: #1abc9c;
            color: #ffffff;
        }
        button.all-clear {
            background-color: #f44336;
            color: #ffffff;
        }
        button:hover {
            background-color: #d4d4d4;
        }
        button.operator:hover {
            background-color: #e67e22;
        }
        button.equals:hover {
            background-color: #16a085;
        }
        button.all-clear:hover {
            background-color: #e57373;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" class="calculator-screen" value="0" disabled />
        <div class="calculator-keys">
            <button type="button" class="operator" value="+">+</button>
            <button type="button" class="operator" value="-">-</button>
            <button type="button" class="operator" value="*">&times;</button>
            <button type="button" class="operator" value="/">&divide;</button>

            <button type="button" value="7">7</button>
            <button type="button" value="8">8</button>
            <button type="button" value="9">9</button>

            <button type="button" value="4">4</button>
            <button type="button" value="5">5</button>
            <button type="button" value="6">6</button>

            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>

            <button type="button" value="0">0</button>
            <button type="button" class="decimal" value=".">.</button>
            <button type="button" class="all-clear" value="all-clear">AC</button>

            <button type="button" class="equals" value="=">=</button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const calculator = document.querySelector('.calculator');
            const keys = calculator.querySelector('.calculator-keys');
            const display = calculator.querySelector('.calculator-screen');

            let firstValue = '';
            let operator = '';
            let shouldResetDisplay = false;

            keys.addEventListener('click', function (event) {
                const { target } = event;
                if (!target.matches('button')) {
                    return;
                }

                const { value } = target;

                if (target.classList.contains('operator')) {
                    if (firstValue && operator && !shouldResetDisplay) {
                        display.value = calculate(firstValue, operator, display.value);
                    }
                    firstValue = display.value;
                    operator = value;
                    shouldResetDisplay = true;
                } else if (target.classList.contains('decimal')) {
                    if (!display.value.includes('.')) {
                        display.value += '.';
                    }
                } else if (target.classList.contains('all-clear')) {
                    firstValue = '';
                    operator = '';
                    display.value = '0';
                } else if (target.classList.contains('equals')) {
                    if (firstValue && operator) {
                        display.value = calculate(firstValue, operator, display.value);
                        firstValue = '';
                        operator = '';
                    }
                } else {
                    if (display.value === '0' || shouldResetDisplay) {
                        display.value = value;
                        shouldResetDisplay = false;
                    } else {
                        display.value += value;
                    }
                }
            });

            function calculate(n1, operator, n2) {
                const firstNum = parseFloat(n1);
                const secondNum = parseFloat(n2);
                if (operator === '+') {
                    return firstNum + secondNum;
                } else if (operator === '-') {
                    return firstNum - secondNum;
                } else if (operator === '*') {
                    return firstNum * secondNum;
                } else if (operator === '/') {
                    if (secondNum === 0) {
                        alert('Cannot divide by zero');
                        return 'Error';
                    }
                    return firstNum / secondNum;
                }
                return n2;
            }
        });
    </script>
</body>
</html>
