<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Style Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
        }

        .calculator {
            width: 100%;
            max-width: 320px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .display {
            background-color: #262626;
            color: #fff;
            padding: 20px;
            font-size: 2em;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
        }

        button {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            background-color: #f0f0f0;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #d0d0d0;
        }

        button.operator {
            background-color: #fea;
        }

        button.operator:hover {
            background-color: #f90;
        }

        @media (max-width: 480px) {
            button {
                padding: 15px;
                font-size: 1.25em;
            }
        }
    </style>
</head>
<body>
    <div class="calculator" role="application" aria-label="Calculator">
        <div class="display" id="display" aria-live="polite">0</div>
        <div class="buttons">
            <button data-action="clear" aria-label="Clear">C</button>
            <button data-action="append" data-value="(" aria-label="Left Parenthesis">(</button>
            <button data-action="append" data-value=")" aria-label="Right Parenthesis">)</button>
            <button data-action="append" class="operator" data-value="/" aria-label="Divide">÷</button>

            <button data-action="append" data-value="7" aria-label="Seven">7</button>
            <button data-action="append" data-value="8" aria-label="Eight">8</button>
            <button data-action="append" data-value="9" aria-label="Nine">9</button>
            <button data-action="append" class="operator" data-value="*" aria-label="Multiply">×</button>

            <button data-action="append" data-value="4" aria-label="Four">4</button>
            <button data-action="append" data-value="5" aria-label="Five">5</button>
            <button data-action="append" data-value="6" aria-label="Six">6</button>
            <button data-action="append" class="operator" data-value="-" aria-label="Subtract">−</button>

            <button data-action="append" data-value="1" aria-label="One">1</button>
            <button data-action="append" data-value="2" aria-label="Two">2</button>
            <button data-action="append" data-value="3" aria-label="Three">3</button>
            <button data-action="append" class="operator" data-value="+" aria-label="Add">+</button>

            <button data-action="append" data-value="0" aria-label="Zero">0</button>
            <button data-action="append" data-value="." aria-label="Decimal">.</button>
            <button data-action="calculate" aria-label="Equals">=</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.3.0/math.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const display = document.getElementById('display');

            function clearDisplay() {
                display.innerText = '0';
            }

            function appendToDisplay(value) {
                if (display.innerText === '0' && value !== '.') {
                    display.innerText = value;
                } else {
                    display.innerText += value;
                }
            }

            document.querySelector('button[data-action="clear"]').addEventListener('click', clearDisplay);
            document.querySelectorAll('button[data-action="append"]').forEach(button => {
                button.addEventListener('click', () => {
                    appendToDisplay(button.getAttribute('data-value'));
                });
            });
        });
    </script>
</body>
</html>
